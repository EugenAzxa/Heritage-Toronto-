name = "speak-with-albert"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Comma-separated list of origins allowed to call this Worker.
# Leave empty during local development to accept any origin.
[vars]
ALLOWED_ORIGINS = "https://eugenazxa.github.io"

# Per-IP rate limiting. Optional: delete this block and the Worker
# still runs, it just stops throttling.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# ANTHROPIC_API_KEY is a secret, never a var. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
